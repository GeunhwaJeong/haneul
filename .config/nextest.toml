# Setup scripts (experimental) require a recent nextest. CI installs the latest
# via taiki-e/install-action@nextest; local runs need an upgrade from older ones.
nextest-version = { required = "0.9.98" }

# Opt in to setup scripts, used below to raise the worker-thread stack size for
# the graphql transactional_tests (Rust 1.96 async-frame bloat overflows the
# default 2 MiB tokio worker stack). Setup scripts run at test time only, so this
# does not affect builds — unlike a global `.cargo/config.toml [env]`.
experimental = ["setup-scripts"]

[scripts.setup.big-worker-stack]
command = 'scripts/nextest/big-worker-stack.sh'

# Adapter and verifier transactional tests pinned to a protocol version that
# has no Haneul equivalent are excluded by default. Haneul's protocol history starts at
# version 115, so there is no framework bytecode for earlier versions (the
# genesis builder falls back to the current framework, which those older
# configurations cannot deserialize), and the Haneul numbering compresses
# several upstream versions per release, so a few intermediate upstream
# versions (131 here) have no configuration-equivalent Haneul version either.
# Tests pinned to a version with an exact Haneul equivalent are re-pinned to it
# instead. The excluded tests describe behaviour of versions this network never
# ran; they stay in the tree so upstream syncs apply cleanly and can be run with
# --ignore-default-filter.
# The same applies to three indexer-alt-e2e tests: clever_error_pre_v48 checks
# behaviour before version 48, end_of_epoch advances the epoch with the version 70
# system package snapshot, and test_coin_balance_change_cleanup indexes version 1
# transaction effects, which only versions before 28 produce.
[profile.default]
default-filter = 'not (package(haneul-adapter-transactional-tests) and test(/^run_test::(init\/entry_old\.mvir|runtime_behavior\/versioned_check_swap_loc_old\.move|mvcc\/v0\/child_of_child\.move|mvcc\/v0\/find_all_uids_dof\.move|mvcc\/v0\/find_all_uids_on_child\.move|mvcc\/v0\/find_all_uids\.move|mvcc\/v0\/middle_version_less_than_child\.move|mvcc\/v0\/not_root_version_flipped_case\.move|mvcc\/v0\/not_root_version\.move|entry_points\/obj_vector_generic_v20\.move|entry_points\/obj_vector_v20\.move|shared\/by_value_shared_object_v20\.move|transfer_object\/does_not_have_store_receive_version30\.move|shared\/re_share_v45\.move|upgrade\/abort_code_resolution_v46\.move|entry_points\/large_enum_v58\.move|programmable\/make_vec_non_existent_type_v71\.move|child_count\/count_decremented_v74\.move|deny_list_v2\/double_add_v74\.move|dynamic_fields\/mut_unchanged_chain_dof_v74\.move|dynamic_fields\/mut_unchanged_chain_v74\.move|dynamic_fields\/mut_unchanged_dof_v74\.move|dynamic_fields\/mut_unchanged_v74\.move|programmable\/index_before_typing_v78\.move|programmable\/large_dev_inspect_pure_v81\.move|programmable\/large_vector_v81\.move|upgrade\/type_resolution_v82\.move|upgrade\/type_resolution\.move|shared\/by_value_shared_object_deletion_via_make_move_vec_fails_v90\.move|shared\/by_value_shared_object_deletion_via_make_move_vec_v90\.move|shared\/by_value_shared_object_deletion_via_move_call_fails_v90\.move|shared\/by_value_shared_object_deletion_via_move_call_v90\.move|upgrade\/upgrade_init_lumpy_ordering_v131\.move)$/)) and not (package(haneul-verifier-transactional-tests) and test(/^run_test::(entry_points\/clock_mut_v106\.mvir|entry_points\/clock_val_v106\.mvir|entry_points\/generic_obj_mut_ref_vector_v106\.mvir|entry_points\/generic_obj_ref_vector_v106\.mvir|entry_points\/generic_with_key_invalid_v106\.mvir|entry_points\/nested_key_generic_vector_param_v106\.mvir|entry_points\/non_key_struct_generic_v106\.mvir|entry_points\/non_key_struct_v106\.mvir|entry_points\/non_key_struct_vector_v106\.mvir|entry_points\/obj_mut_ref_vector_v106\.mvir|entry_points\/obj_ref_vector_v106\.mvir|entry_points\/random_mut_v106\.mvir|entry_points\/random_val_v106\.mvir|entry_points\/return_values_invalid_v106\.mvir|enums\/enum_with_key_only_uid_field_version_48\.mvir|enums\/enum_with_key_only_version_48\.mvir|enums\/enum_with_key_store_uid_field_version_48\.mvir|enums\/enum_with_key_store_version_48\.mvir|private_generics\/receive_without_key_version30\.mvir)$/)) and not (package(haneul-indexer-alt-e2e-tests) and test(/^run_test::(graphql\/transaction_effects\/execution_error\/clever_error_pre_v48\.move|graphql\/transactions\/kind\/end_of_epoch\.move)$/)) and not (binary_id(haneul-indexer-alt-e2e-tests::consistent_store_list_owned_objects_tests) and test(=test_coin_balance_change_cleanup))'

# Apply the 8 MiB worker stack to the whole package: multiple binaries overflow
# (transactional_tests, jsonrpc_address_balance_coin_tests, ...). Listed under
# both `default` (local runs) and `ci` (CI uses `--profile ci`); a named setup
# script runs once per test run regardless of how many rules reference it.
[[profile.default.scripts]]
filter = 'package(haneul-indexer-alt-e2e-tests)'
setup = 'big-worker-stack'

[[profile.ci.scripts]]
filter = 'package(haneul-indexer-alt-e2e-tests)'
setup = 'big-worker-stack'

# test_tree_shaking_package_deps_on_pkg_upgrade runs on the libtest thread, whose
# 2 MiB default stack it overflows in unoptimized builds.
[[profile.default.scripts]]
filter = 'binary_id(haneul::cli_tests) and test(=test_tree_shaking_package_deps_on_pkg_upgrade)'
setup = 'big-worker-stack'

[[profile.ci.scripts]]
filter = 'binary_id(haneul::cli_tests) and test(=test_tree_shaking_package_deps_on_pkg_upgrade)'
setup = 'big-worker-stack'

[profile.ci]
# Print output for failing tests only when they fail.
failure-output = "immediate"
# Include failed attempts so a successful retry does not hide the failure output.
status-level = "retry"
# Do not cancel the test run on the first failure.
fail-fast = false
# Retry failing tests in order to not block builds on flaky tests
retries = 3
# Timeout tests after 4 minutes
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.ci.overrides]]
filter = 'package(haneul-fork-e2e-tests)'
# Every shell test spawns `haneul start` (validator, fullnode, temporary PostgreSQL, indexer,
# consistent store, GraphQL, faucet) and then a fork, and the first test of a run may also link
# the haneul and haneul-fork binaries, so allow ten minutes rather than five.
slow-timeout = { period = "120s", terminate-after = 5 }

[profile.simtestnightly]
# Print out output for failing tests as soon as they fail, and also at the end
# of the run (for easy scrollability).
failure-output = "immediate"
# Show skipped tests in the CI output.
status-level = "fail"
# Do not cancel the test run on the first failure.
fail-fast = false
# Mark tests as slow after 30m, terminate after 1.5h
slow-timeout = { period = "30m", terminate-after = 3 }

[profile.ci.junit]
path = "junit.xml"
