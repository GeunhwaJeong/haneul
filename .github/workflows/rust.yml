name: Rust

# Fast lane: runs on every PR and push. Kept small enough to finish on
# standard hosted runners in ~25 minutes. The full test suite, simulator
# tests, and windows build live in full-tests.yml and simtest-nightly.yml,
# which run on a schedule and via workflow_dispatch.
on:
  push:
    branches:
      - 'main'
      - 'devnet'
      - 'testnet'
      - 'mainnet'
      - 'releases/haneul-*-release'
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_dispatch:
    inputs:
      haneul_repo_ref:
        description: "Branch / commit to test"
        type: string
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # Disable incremental compilation.
  #
  # Incremental compilation is useful as part of an edit-build-test-edit cycle,
  # as it lets the compiler avoid recompiling code that hasn't changed. However,
  # on CI, we're not making small edits; we're almost always building the entire
  # project from scratch. Thus, incremental compilation on CI actually
  # introduces *additional* overhead to support making future builds
  # faster...but no future builds will ever occur in any given CI environment.
  #
  # See https://matklad.github.io/2021/09/04/fast-rust-builds.html#ci-workflow
  # for details.
  CARGO_INCREMENTAL: 0
  # Allow more retries for network requests in cargo (downloading crates) and
  # rustup (installing toolchains). This should help to reduce flaky CI failures
  # from transient network timeouts or other issues.
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  # Don't emit giant backtraces in the CI logs.
  RUST_BACKTRACE: short
  # RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  # Set log level in CI to error. If you need more information to debug a CI
  # failure, change this temporarily and rerun your tests
  RUST_LOG: error

jobs:
  diff:
    runs-on: [ ubuntu-latest ]
    outputs:
      isRust: ${{ steps.diff.outputs.isRust }}
      isMove: ${{ steps.diff.outputs.isMove }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6.0.2
        with:
          ref: ${{ github.event.inputs.haneul_repo_ref || github.ref }}
      - name: Detect Changes
        uses: './.github/actions/diffs'
        id: diff

  license-check:
    name: license-check
    runs-on: [ ubuntu-latest ]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6.0.2
        with:
          ref: ${{ github.event.inputs.haneul_repo_ref || github.ref }}
      - name: Run license check
        run: cargo xlint
      - name: Git checks
        run: scripts/git-checks.sh

  # Runs on every PR (unlike the full suite in full-tests.yml, which does not
  # fit hosted runners on every push). Scoped to core-crate unit tests so
  # regressions in key handling, config, and protocol logic are caught before
  # merge instead of at the next scheduled full run.
  unit-tests:
    needs: diff
    if: needs.diff.outputs.isRust == 'true'
    timeout-minutes: 90
    env:
      # Tests written with #[sim_test] are often flaky if run as #[tokio::test] - this var
      # causes #[sim_test] to only run under the deterministic `simtest` job.
      HANEUL_SKIP_SIMTESTS: 1
    runs-on: [ ubuntu-latest ]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6.0.2
        with:
          ref: ${{ github.event.inputs.haneul_repo_ref || github.ref }}
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@protoc
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - name: Set Swap Space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761 # pin@master
        with:
          swap-size-gb: 10
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # pin@v2
      - name: cargo nextest (core unit tests)
        run: |
          cargo nextest run --profile ci --lib -p haneul -p haneul-keys -p haneul-types -p haneul-config -p haneul-protocol-config -p shared-crypto
      # Ensure there are no uncommitted changes in the repo after running tests
      - run: scripts/changed-files.sh
        shell: bash

  # This job ensures that Move unit tests are run if there are changes
  # to Move code but not Rust code (If there are Rust changes, they
  # will be run as part of a larger test suite).
  move-test:
    needs: diff
    if: needs.diff.outputs.isRust == 'false' && needs.diff.outputs.isMove == 'true'
    timeout-minutes: 10
    runs-on: [ ubuntu-latest ]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6.0.2
        with:
          ref: ${{ github.event.inputs.haneul_repo_ref || github.ref }}
      - uses: taiki-e/install-action@nextest
      - name: Run move tests
        run: |
          cargo nextest run -p haneul-framework-tests --test move_tests

  clippy:
    needs: diff
    if: needs.diff.outputs.isRust == 'true'
    runs-on: [ ubuntu-latest ]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6.0.2
        with:
          ref: ${{ github.event.inputs.haneul_repo_ref || github.ref }}
      - run: rustup component add clippy
      # TODO(bradh): debug and re-enable this; the caching is breaking the clippy build
      # Enable caching of the 'librocksdb-sys' crate by additionally caching the
      # 'librocksdb-sys' src directory which is managed by cargo
      # - uses: bmwill/rust-cache@v1 # Fork of 'Swatinem/rust-cache' which allows caching additional paths
      #   with:
      #     path: ~/.cargo/registry/src/**/librocksdb-sys-*

      # See '.cargo/config' for list of enabled/disappled clippy lints
      - name: cargo clippy
        run: cargo xclippy -- -D warnings

  rustfmt:
    needs: diff
    if: needs.diff.outputs.isRust == 'true'
    runs-on: [ ubuntu-latest ]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6.0.2
        with:
          ref: ${{ github.event.inputs.haneul_repo_ref || github.ref }}
      - run: rustup component add rustfmt
      - run: cargo fmt --check

  snapshot-check:
    needs: diff
    if: needs.diff.outputs.isRust == 'true'
    runs-on: [ ubuntu-latest ]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6.0.2
        with:
          ref: ${{ github.event.inputs.haneul_repo_ref || github.ref }}
      - name: Check for committed *.snap.new files
        run: |
          # *.snap.new files are produced by insta when a snapshot test fails.
          # They must never be committed - review and accept them with `cargo insta review` instead.
          files=$(git ls-files '*.snap.new')
          if [ -n "$files" ]; then
            echo "Error: the following *.snap.new files are committed to the repo:"
            echo "$files"
            echo "Run 'cargo insta review' to accept or reject pending snapshots."
            exit 1
          fi

  cargo-deny:
    name: cargo-deny (bans, licenses, sources)
    needs: diff
    if: needs.diff.outputs.isRust == 'true'
    runs-on: [ ubuntu-latest ]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6.0.2
        with:
          ref: ${{ github.event.inputs.haneul_repo_ref || github.ref }}
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check bans licenses sources --hide-inclusion-graph

  cargo-deny-advisories:
    name: cargo-deny (advisories)
    needs: diff
    if: needs.diff.outputs.isRust == 'true'
    runs-on: [ ubuntu-latest ]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6.0.2
        with:
          ref: ${{ github.event.inputs.haneul_repo_ref || github.ref }}
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check advisories --hide-inclusion-graph

  haneul-execution-cut:
    name: cutting a new execution layer
    needs: [diff, rustfmt, clippy]
    if: needs.diff.outputs.isRust == 'true'
    runs-on: [ ubuntu-latest ]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6.0.2
        with:
          ref: ${{ github.event.inputs.haneul_repo_ref || github.ref }}
      - name: Install cargo-hakari, and cache the binary
        uses: baptiste0928/cargo-install@1cd874a5478fdca35d868ccc74640c5aabbb8f1b # pin@v3.0.0
        with:
          crate: cargo-hakari
          locked: true
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6.0.2
        with:
          ref: ${{ github.event.inputs.haneul_repo_ref || github.ref }}
      - name: Make cut
        run: ./scripts/execution_layer.py cut for_ci_test
      - name: Check execution builds
        run: cargo build -p haneul-execution
