name: Create Haneul Release and Announce
run-name: Create Haneul Release for ${{ inputs.network }}

concurrency: ${{ github.workflow }}-${{ inputs.network }}

on:
  workflow_dispatch:
    inputs:
      haneul_commit:
        description: "Haneul commit to ship"
        type: string
        required: true
      network:
        description: Network to generate and announce release for
        required: true
        type: choice
        options:
          - devnet
          - testnet
          - mainnet
      announce:
        description: Announce the release?
        type: boolean
        default: false
        required: true
env:
  RELEASE_NOTES_FILE: './release_notes.txt'

jobs:
  create-release:
    name: Create Release for ${{ inputs.network }}
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.haneul.outputs.new_tag }}

    steps:
      - name: Checkout haneul main branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6.0.2
        with:
          fetch-depth: 0
          ref: main

      - name: Get current and previous release branches
        shell: bash
        run: |
          export haneul_main_version=$(cat Cargo.toml | grep '^version =' | tr -d '\"' | awk '{ print $3 }')
          export major_version=$(echo $haneul_main_version | cut -d. -f1)
          export minor_version=$(echo $haneul_main_version | cut -d. -f2)
          export patch_version=$(echo $haneul_main_version | cut -d. -f3)
          export current_minor_version=$(($minor_version - 1))
          export current_release_version=$major_version.$current_minor_version.$patch_version
          echo "current_release_version=${current_release_version}" >> $GITHUB_ENV

          export current_release_branch="releases/haneul-v${current_release_version}-release"
          echo "current_release_branch=${current_release_branch}" >> $GITHUB_ENV

          export previous_minor_version=$(($current_minor_version - 1))
          export previous_release_version=$major_version.$previous_minor_version.$patch_version
          export previous_release_branch="releases/haneul-v${previous_release_version}-release"
          echo "previous_release_branch=${previous_release_branch}" >> $GITHUB_ENV

      - name: Checkout release branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.haneul_commit }}

      - name: Update ${{ inputs.network }} branch
        shell: bash
        run: |
          export haneul_release_version=$(cat Cargo.toml | grep '^version =' | tr -d '\"' | awk '{ print $3 }')
          echo "haneul_release_version=${haneul_release_version}" >> $GITHUB_ENV

          echo "${{ secrets.HANEUL_CREATE_RELEASE }}" | gh auth login --with-token
          echo "{\"sha\": \"${{ inputs.haneul_commit }}\", \"force\": true}" | gh api -X PATCH /repos/GeunhwaJeong/haneul/git/refs/heads/${{ inputs.network }} \
            --header "Accept: application/vnd.github+json" --input -

      - name: Update framework/${{ inputs.network }} branch
        if: ${{ inputs.network == 'devnet' }}
        shell: bash
        run: |
          echo "${{ secrets.HANEUL_CREATE_RELEASE }}" | gh auth login --with-token
          echo "{\"sha\": \"${{ inputs.haneul_commit }}\", \"force\": true}" | gh api -X PATCH /repos/GeunhwaJeong/haneul/git/refs/heads/framework/${{ inputs.network }} \
            --header "Accept: application/vnd.github+json" --input -

      - name: Create ${{ inputs.network }}-v${{ env.haneul_release_version }} release tag
        shell: bash
        id: haneul
        env:
          HANEUL_RELEASE_VERSION: ${{ env.haneul_release_version }}
        run: |
          export release_tag="${{ inputs.network }}-v${{ env.HANEUL_RELEASE_VERSION }}"
          echo "release_tag=${release_tag}" >> $GITHUB_ENV
          echo "new_tag=${release_tag}" >> "$GITHUB_OUTPUT"

          echo "{\"ref\": \"refs/tags/${release_tag}\", \"sha\": \"${{ inputs.haneul_commit }}\"}" | \
            gh api -X POST /repos/GeunhwaJeong/haneul/git/refs \
              --header "Accept: application/vnd.github+json" --input -

      - name: Get commits for branches
        shell: bash
        env:
          PREVIOUS_BRANCH: ${{ env.previous_release_branch }}
          CURRENT_BRANCH: ${{ env.current_release_branch }}
        working-directory: ./
        run: |
          echo "previous_commit=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/GeunhwaJeong/haneul/commits/${{ env.PREVIOUS_BRANCH }}| jq .sha | tr -d '"')" >> $GITHUB_ENV
          echo "current_commit=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/GeunhwaJeong/haneul/commits/${{ env.CURRENT_BRANCH }} | jq .sha | tr -d '"')" >> $GITHUB_ENV

      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6.0.2
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # pin@v7.0.0
        with:
          python-version: 3.10.10

      - name: Generate Release Notes for ${{ env.release_tag }}
        shell: bash
        env:
          PREVIOUS_COMMIT: ${{ env.previous_commit }}
          CURRENT_COMMIT: ${{ env.current_commit }}
          RELEASE_TAG: ${{ env.release_tag }}
        working-directory: ./
        run: |
          GH_TOKEN=${{ secrets.GITHUB_TOKEN }} \
          python ./scripts/release_notes.py generate ${{ env.PREVIOUS_COMMIT }} ${{ env.CURRENT_COMMIT }} | tee -a ${{ env.RELEASE_NOTES_FILE }}
          echo "---" >> ${{ env.RELEASE_NOTES_FILE }}
          echo "#### Full Log: https://github.com/GeunhwaJeong/haneul/commits/${{ env.RELEASE_TAG }}" >> ${{ env.RELEASE_NOTES_FILE }}

          if [[ ${{ env.RELEASE_TAG }} == devnet* ]]; then
            echo "pre_release=true" >> $GITHUB_ENV
          else
            echo "pre_release=false" >> $GITHUB_ENV
          fi

      - name: Create Release
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # pin@v1
        env:
          RELEASE_TAG: ${{ env.release_tag }}
          GITHUB_TOKEN: ${{ secrets.HANEUL_CREATE_RELEASE }}
          PRE_RELEASE: ${{ env.pre_release }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          release_name: ${{ env.RELEASE_TAG }}
          body_path: ${{ env.RELEASE_NOTES_FILE }}
          draft: false
          prerelease: ${{ env.PRE_RELEASE }}

  announce-release:
    name: Announce Release in Discord
    if: ${{ inputs.announce == true && inputs.network != 'devnet' }}
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Release Announce in GeunhwaJeong/haneul-operations
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # pin@v4.0.1
        with:
          repository: GeunhwaJeong/haneul-operations
          token: ${{ secrets.DOCKER_BINARY_BUILDS_DISPATCH }}
          event-type: haneul-release-announce
          client-payload: '{"environment": "${{ inputs.network }}"}'
