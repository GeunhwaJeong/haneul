name: Simulator Tests

# The deterministic simulator suite is the highest-value test lane for a
# blockchain node: it exercises consensus, epoch change, and crash recovery
# under a seeded scheduler. It currently exceeds hosted-runner disk and
# memory, so there is no schedule; this exists for on-demand runs. The
# release safety net is the local simtest pass done before every release
# tag.
on:
  workflow_dispatch:
    inputs:
      haneul_repo_ref:
        description: "Branch / commit to test"
        type: string
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Disable incremental compilation, see rust.yml for rationale.
  CARGO_INCREMENTAL: 0
  # Allow more retries for network requests in cargo (downloading crates) and
  # rustup (installing toolchains). This should help to reduce flaky CI failures
  # from transient network timeouts or other issues.
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  # Don't emit giant backtraces in the CI logs.
  RUST_BACKTRACE: short
  RUST_LOG: error
  MSIM_WATCHDOG_TIMEOUT_MS: 300000
  # Full debug info for the whole workspace does not fit the ~60GB of disk a
  # hosted runner has after cleanup. Line tables keep panic backtraces usable
  # at a fraction of the size.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  simtest:
    timeout-minutes: 350
    runs-on: [ ubuntu-latest ]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6.0.2
        with:
          ref: ${{ github.event.inputs.haneul_repo_ref || github.ref }}
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@protoc
      - name: Add postgres to PATH
        shell: bash
        run: |
          pg_bin=$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | head -1)
          [ -n "$pg_bin" ] || { echo "ERROR: no postgres bin dir found under /usr/lib/postgresql"; exit 1; }
          echo "$pg_bin" >> "$GITHUB_PATH"
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /
      - name: Put the cargo target dir on the second disk
        run: |
          # Even after cleanup the root disk cannot hold a full workspace
          # build; /mnt has ~65GB nothing else uses. A symlink (rather than
          # CARGO_TARGET_DIR) keeps hardcoded target/ paths such as
          # check-determinism.sh working unchanged.
          sudo mkdir -p /mnt/target
          sudo chown "$USER" /mnt/target
          ln -s /mnt/target target
          df -h / /mnt
      - name: Set Swap Space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761 # pin@master
        with:
          swap-size-gb: 10
      - name: cargo simtest
        run: |
          MSIM_TEST_SEED="$(printf "%lu\n" 0x$(git rev-parse HEAD | cut -c1-16))" scripts/simtest/cargo-simtest simtest --profile ci --cargo-quiet --no-fail-fast
      - name: check determinism
        run: |
          MSIM_TEST_SEED="$(printf "%lu\n" 0x$(git rev-parse HEAD | cut -c1-16))" scripts/simtest/check-determinism.sh

  simtest-mainnet:
    timeout-minutes: 350
    runs-on: [ ubuntu-latest ]
    env:
      HANEUL_PROTOCOL_CONFIG_CHAIN_OVERRIDE: mainnet
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6.0.2
        with:
          ref: ${{ github.event.inputs.haneul_repo_ref || github.ref }}
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@protoc
      - name: Add postgres to PATH
        shell: bash
        run: |
          pg_bin=$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | head -1)
          [ -n "$pg_bin" ] || { echo "ERROR: no postgres bin dir found under /usr/lib/postgresql"; exit 1; }
          echo "$pg_bin" >> "$GITHUB_PATH"
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /
      - name: Put the cargo target dir on the second disk
        run: |
          # Even after cleanup the root disk cannot hold a full workspace
          # build; /mnt has ~65GB nothing else uses. A symlink (rather than
          # CARGO_TARGET_DIR) keeps hardcoded target/ paths such as
          # check-determinism.sh working unchanged.
          sudo mkdir -p /mnt/target
          sudo chown "$USER" /mnt/target
          ln -s /mnt/target target
          df -h / /mnt
      - name: Set Swap Space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761 # pin@master
        with:
          swap-size-gb: 10
      - name: cargo simtest
        run: |
          MSIM_TEST_SEED="$(printf "%lu\n" 0x$(git rev-parse HEAD | cut -c1-16))" scripts/simtest/cargo-simtest simtest --profile ci --cargo-quiet --no-fail-fast
