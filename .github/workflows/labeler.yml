name: "Pull Request Labeler"
on:
  workflow_dispatch:

jobs:
  triage:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13
      with:
        repo-token: "${{ secrets.GITHUB_TOKEN }}"

  notify-prs:
    name: Dispatch workflow to notify slack channel on PRs
    runs-on: ubuntu-latest
    if: ${{ github.event.action == 'opened' }}
    steps:
      - name: Dispatch github-issues-external-prs-monitor in GeunhwaJeong/haneul-operations
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # pin@v4.0.1
        with: 
          repository: GeunhwaJeong/haneul-operations
          token: ${{ secrets.DOCKER_BINARY_BUILDS_DISPATCH }}
          event-type: github-issues-external-prs-monitor
          client-payload: '{"author": "${{github.event.pull_request.user.login}}", "event_name": "pull_request", "pull_request_number": "${{github.event.pull_request.number}}"}'

