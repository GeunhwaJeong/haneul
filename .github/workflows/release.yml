name: Attach Haneul binaries to a release
run-name: Attach Haneul binaries to a ${{ inputs.haneul_tag }} release

on:
  release:
    types: created
  workflow_dispatch:
    inputs:
      haneul_tag:
        description: 'Haneul repo tag to build from'
        type: string
        required: true

concurrency: ${{ github.workflow }}-${{ inputs.haneul_tag || github.ref_name }}

env:
  TAG_NAME: "${{ github.event.inputs.haneul_tag || github.ref_name }}"
  BINARY_LIST_FILE: "./binary-build-list.json"
  CARGO_TERM_COLOR: always
  # Disable incremental compilation.
  #
  # Incremental compilation is useful as part of an edit-build-test-edit cycle,
  # as it lets the compiler avoid recompiling code that hasn't changed. However,
  # on CI, we're not making small edits; we're almost always building the entire
  # project from scratch. Thus, incremental compilation on CI actually
  # introduces *additional* overhead to support making future builds
  # faster...but no future builds will ever occur in any given CI environment.
  #
  # See https://matklad.github.io/2021/09/04/fast-rust-builds.html#ci-workflow
  # for details.
  CARGO_INCREMENTAL: 0
  # Allow more retries for network requests in cargo (downloading crates) and
  # rustup (installing toolchains). This should help to reduce flaky CI failures
  # from transient network timeouts or other issues.
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  # Don't emit giant backtraces in the CI logs.
  RUST_BACKTRACE: short
  TMP_BUILD_DIR: './tmp/release'

jobs:
  release-build:
    name: Build & Publish Binaries
    # Standard hosted runners (4 vCPU) need a few hours per platform for a
    # release build; stay under the hard 6h job cap.
    timeout-minutes: 350
    permissions:
      contents: write # attach built archives to the GitHub release
    strategy:
      matrix:
        os:
          [
            ubuntu-latest, # ubuntu-x86_64
            ubuntu-24.04-arm, # ubuntu-aarch64
            macos-latest # macos-arm64
          ]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Validate the release tag
        shell: bash
        run: |
          # Read TAG_NAME as a shell variable (it is a workflow-level env, above).
          # NEVER splice the raw input into this script through GitHub Actions
          # expression interpolation: a workflow_dispatch haneul_tag is
          # attacker-controllable, so injected shell here could run before the
          # guard below.
          haneul_tag="${TAG_NAME#refs/tags/}"
          # Only published release tags may be built. Fully anchored (^...$) with a
          # restricted charset so the value also cannot smuggle a newline into the
          # GITHUB_ENV writes below.
          if [[ ! "$haneul_tag" =~ ^(devnet|testnet|mainnet)-v[0-9A-Za-z.-]+$ ]]; then
            echo "haneul_tag must be a release tag (devnet-v*/testnet-v*/mainnet-v*), got: $haneul_tag"
            exit 1
          fi
          echo "haneul_tag=$haneul_tag" >> "$GITHUB_ENV"
          haneul_version=$(echo "$haneul_tag" | sed -e 's/mainnet-v//' -e 's/testnet-v//')
          echo "haneul_version=$haneul_version" >> "$GITHUB_ENV"

      - name: Check out ${{ env.haneul_tag }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6.0.2
        with:
          # pin to the tag namespace so the input can never resolve to a branch
          ref: refs/tags/${{ env.haneul_tag }}

      - name: Set os/arch variables
        shell: bash
        run: |
          export arch=$(uname -m)
          export system_os=$(echo ${{ matrix.os }} | cut -d- -f1)
          echo "os_type=${system_os}-${arch}" >> $GITHUB_ENV

      - name: Free up runner disk space (Ubuntu)
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        shell: bash
        run: |
          # Hosted runners leave only ~20-30GB free; the release target dir
          # needs much more. Drop preinstalled toolchains we never use.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Put the cargo target dir on the second disk (Ubuntu)
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        shell: bash
        run: |
          # Even after cleanup the root disk cannot hold a full release
          # build; /mnt has ~65GB nothing else uses. A symlink keeps the
          # target/release paths used by the packaging steps working
          # unchanged.
          sudo mkdir -p /mnt/target
          sudo chown "$USER" /mnt/target
          ln -s /mnt/target target
          df -h / /mnt

      - name: Set Swap Space (Ubuntu)
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761 # pin@master
        with:
          swap-size-gb: 8

      - name: Install libpq (Ubuntu)
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        shell: bash
        run: |
          sudo apt update && sudo apt install -y libpq-dev

      - name: Install postgres (MacOS arm64)
        if: ${{ matrix.os == 'macos-latest' }}
        shell: bash
        env:
          PQ_LIB_DIR: "$(brew --prefix libpq)/lib"
          LIBRARY_PATH: "/opt/homebrew/lib:$LIBRARY_PATH"
          PKG_CONFIG_PATH: "/opt/homebrew/lib/pkgconfig:$PKG_CONFIG_PATH"
          PATH: "/opt/homebrew/bin:$PATH"
        run: |
          brew install postgresql

      - name: Cargo build for ${{ matrix.os }} platform
        shell: bash
        run: |
          [ -f ~/.cargo/env ] && source ~/.cargo/env
          # Build only the binaries we actually package (the release_binaries in
          # binary-build-list.json, the same list the rename step below moves),
          # not the whole workspace. `haneul` is built separately, once, with the
          # tracing feature.
          haneul_bins=""
          for b in $(jq -r '.release_binaries[] | select(. != "haneul")' "${{ env.BINARY_LIST_FILE }}"); do
            haneul_bins="$haneul_bins --bin $(echo "$b" | tr -d $'\r')"
          done
          cargo build --release $haneul_bins
          cargo build --release --features tracing --bin haneul

      - name: Rename binaries for ${{ matrix.os }}
        shell: bash
        run: |
          mkdir -p ${{ env.TMP_BUILD_DIR }}

          [ ! -f ${{ env.BINARY_LIST_FILE }} ] && echo "${{ env.BINARY_LIST_FILE }} cannot be found" && exit 1
          for binary in $(cat ${{ env.BINARY_LIST_FILE }} | jq -r '.release_binaries[]'); do
            export binary=$(echo ${binary} | tr -d $'\r')
            mv ./target/release/${binary} ${{ env.TMP_BUILD_DIR }}/${binary}
          done

          tar -cvzf ./tmp/haneul-${{ env.haneul_tag }}-${{ env.os_type }}.tgz -C ${{ env.TMP_BUILD_DIR }} .

      - name: Upload release artifacts for ${{ matrix.os }} platform
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # pin@v6.0.0
        with:
          name: haneul-binaries-${{ matrix.os }}
          if-no-files-found: error
          path: |
            ./tmp/haneul-${{ env.haneul_tag }}-${{ env.os_type }}.tgz

      - name: Attach artifacts to ${{ env.haneul_tag }} release in GH
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # pin@v2.5.0
        with:
          tag_name: ${{ env.haneul_tag }}
          files: |
            ./tmp/haneul-${{ env.haneul_tag }}-${{ env.os_type }}.tgz
