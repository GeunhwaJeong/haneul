name: Full Tests

# Heavy lane: the full workspace test suite, storage-backend variant tests,
# doc/schema checks, and the windows build. Too big to run on every PR with
# standard hosted runners, so it runs weekly against main and on demand
# (always run it via workflow_dispatch before cutting a release).
on:
  schedule:
    - cron: '0 17 * * 0' # 2am KST on Mondays
  workflow_dispatch:
    inputs:
      haneul_repo_ref:
        description: "Branch / commit to test"
        type: string
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Disable incremental compilation, see rust.yml for rationale.
  CARGO_INCREMENTAL: 0
  # Allow more retries for network requests in cargo (downloading crates) and
  # rustup (installing toolchains). This should help to reduce flaky CI failures
  # from transient network timeouts or other issues.
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  # Don't emit giant backtraces in the CI logs.
  RUST_BACKTRACE: short
  RUSTDOCFLAGS: -D warnings
  RUST_LOG: error
  # Tests written with #[sim_test] are often flaky if run as #[tokio::test] - this var
  # causes #[sim_test] to only run under the deterministic simtest workflow, and not
  # the non-deterministic jobs here.
  HANEUL_SKIP_SIMTESTS: 1
  # Full debug info for the whole workspace does not fit the ~60GB of disk a
  # hosted runner has after cleanup. Line tables keep panic backtraces usable
  # at a fraction of the size.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  test:
    timeout-minutes: 350
    runs-on: [ ubuntu-latest ]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6.0.2
        with:
          ref: ${{ github.event.inputs.haneul_repo_ref || github.ref }}
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@protoc
      - name: Add postgres to PATH
        shell: bash
        run: |
          pg_bin=$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | head -1)
          [ -n "$pg_bin" ] || { echo "ERROR: no postgres bin dir found under /usr/lib/postgresql"; exit 1; }
          echo "$pg_bin" >> "$GITHUB_PATH"
      - name: Install BigTable emulator
        run: |
          echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" | sudo tee /etc/apt/sources.list.d/google-cloud-sdk.list
          curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/cloud.google.gpg
          sudo apt-get update -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/google-cloud-sdk.list -o Dir::Etc::sourceparts=/dev/null
          sudo apt-get install -y google-cloud-cli-cbt google-cloud-cli-bigtable-emulator
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /
      - name: Set Swap Space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761 # pin@master
        with:
          swap-size-gb: 10
      - name: cargo test
        run: |
          cargo nextest run --profile ci --cargo-quiet -E '!package(haneul-bridge) and !package(haneul-bridge-indexer)'
      # Ensure there are no uncommitted changes in the repo after running tests
      - run: scripts/changed-files.sh
        shell: bash

  test-tidehunter:
    timeout-minutes: 350
    runs-on: [ ubuntu-latest ]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6.0.2
        with:
          ref: ${{ github.event.inputs.haneul_repo_ref || github.ref }}
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@protoc
      - name: Add postgres to PATH
        shell: bash
        run: |
          pg_bin=$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | head -1)
          [ -n "$pg_bin" ] || { echo "ERROR: no postgres bin dir found under /usr/lib/postgresql"; exit 1; }
          echo "$pg_bin" >> "$GITHUB_PATH"
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
      - name: Set Swap Space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761 # pin@master
        with:
          swap-size-gb: 10
      - name: cargo test with tidehunter
        run: |
          RUST_BACKTRACE=1 USE_TIDEHUNTER=1 cargo nextest run --profile ci --cargo-quiet -p haneul-core --features typed-store/tidehunter
      # Ensure there are no uncommitted changes in the repo after running tests
      - run: scripts/changed-files.sh
        shell: bash

  test-extra:
    timeout-minutes: 350
    runs-on: [ ubuntu-latest ]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6.0.2
        with:
          ref: ${{ github.event.inputs.haneul_repo_ref || github.ref }}
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@protoc
      - name: Add postgres to PATH
        shell: bash
        run: |
          pg_bin=$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | head -1)
          [ -n "$pg_bin" ] || { echo "ERROR: no postgres bin dir found under /usr/lib/postgresql"; exit 1; }
          echo "$pg_bin" >> "$GITHUB_PATH"
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
      - name: Set Swap Space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761 # pin@master
        with:
          swap-size-gb: 10
      - name: cargo test (haneul-graphql staging)
        run: |
          cargo nextest run --profile ci --cargo-quiet --features staging -E 'package(haneul-indexer-alt-graphql)'
      - name: doctests
        run: |
          cargo test --doc
      - name: rustdoc
        run: |
          cargo doc --workspace --no-deps
      - name: Install cargo-hakari, and cache the binary
        uses: baptiste0928/cargo-install@1cd874a5478fdca35d868ccc74640c5aabbb8f1b # pin@v3.0.0
        with:
          crate: cargo-hakari
          locked: true
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: haneul-execution
        run: |
          ./scripts/execution_layer.py generate-lib
      - name: Install diesel CLI
        uses: baptiste0928/cargo-install@1cd874a5478fdca35d868ccc74640c5aabbb8f1b # pin@v3.0.0
        with:
          crate: diesel_cli
          version: '=2.2.6'
          locked: true
          args: --no-default-features
          features: postgres
      - name: Indexer Alt schema
        run: |
          ./crates/haneul-indexer-alt-schema/generate_schema.sh
      - name: Indexer Alt Framework schema
        run: |
          ./crates/haneul-pg-db/generate_schema.sh
          cargo fmt -- crates/haneul-pg-db/src/schema.rs
      # Ensure there are no uncommitted changes in the repo after running tests
      - run: scripts/changed-files.sh
        shell: bash

  windows-build:
    timeout-minutes: 350
    runs-on: [ windows-latest ]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6.0.2
        with:
          ref: ${{ github.event.inputs.haneul_repo_ref || github.ref }}

      - uses: taiki-e/install-action@nextest

      - name: cargo build
        shell: bash
        run: |
          cargo build --all-features
