[package]
name = "haneul-sdk"
version.workspace = true
authors.workspace = true
license = "Apache-2.0"
publish = false
edition = "2024"

# This needs to be specified, in addition to the same setting
# in the workspace Cargo.toml.
[lints]
workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_with.workspace = true
futures.workspace = true
bcs.workspace = true
thiserror.workspace = true
tracing.workspace = true

shared-crypto.workspace = true
haneul-config.workspace = true
haneul-crypto.workspace = true
haneul-keys.workspace = true
haneul-rpc.workspace = true
haneul-rpc-api.workspace = true
haneul-sdk-types.workspace = true
haneul-types.workspace = true

# NOTE: It's important to keep the above dependency list short.
# This crate is widely used to develop on Haneul and it's valuable
# to not have to pull in the entire haneul repo for it.

[dev-dependencies]
fastcrypto.workspace = true
haneul-macros.workspace = true
haneul-simulator.workspace = true
tempfile.workspace = true
test-cluster.workspace = true
tokio.workspace = true
