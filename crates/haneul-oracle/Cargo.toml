chrono.workspace = true
tap.workspace = true
bcs.workspace = true

haneul-config.workspace = true
haneul-sdk.workspace = true
haneul-rpc-api.workspace = true
haneul-types.workspace = true
haneullabs-metrics.workspace = true
telemetry-subscribers.workspace = true

[dev-dependencies]
haneul-keys.workspace = true
haneul-move-build.workspace = true
